[package]
name = "rosidl_buffer_rs"
version = "0.1.0"
authors = ["Yuankun Zhu <yuankunz@nvidia.com>"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Backend-neutral Rust buffers and bindings to rosidl::Buffer"

[dependencies]
rosidl_runtime_rs = { version = "0.6", features = ["rosidl-buffer"] }
serde = { version = "1", optional = true }

[dev-dependencies]
quickcheck = "1"
serde_json = "1"

[features]
default = []
# Only for generating documentation without a ROS installation.
use_ros_shim = ["rosidl_runtime_rs/use_ros_shim"]
serde = ["dep:serde", "rosidl_runtime_rs/serde"]

[package.metadata.docs.rs]
features = ["use_ros_shim"]
